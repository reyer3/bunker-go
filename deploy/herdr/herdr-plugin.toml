# bunker as a herdr plugin (herdr 0.8.0+). See README.md next to this file.
id = "bunker"
name = "bunker"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Mail, WhatsApp and Matrix in a side panel"
platforms = ["linux", "macos"]

# The panel "bunker herdr toggle" docks on the left: the compact TUI made
# for a narrow column.
[[panes]]
id = "sidebar"
title = "bunker"
placement = "split"
command = ["bunker", "sidebar"]

# One conversation, opened by Enter in the sidebar in a pane to its right.
# herdr runs this command as fixed argv, so "bunker open" reads the item
# id from BUNKER_OPEN_ID, which the sidebar passes with "--env".
[[panes]]
id = "open"
title = "bunker"
placement = "split"
command = ["bunker", "open"]

# Opens the panel beside the focused pane, focuses it when it is open, and
# closes it when it is already focused. Bind it to a key, see README.md.
[[actions]]
id = "toggle"
title = "Toggle bunker"
description = "Open, focus or close the bunker side panel"
contexts = ["workspace"]
command = ["bunker", "herdr", "toggle"]
