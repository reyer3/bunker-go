# bunker-go sample configuration. Copy to $BUNKER_CONFIG_DIR/config.toml
# (default ~/.config/bunker-go/config.toml). Every account is a
# [[account]] table; "channel" and "name" are read by internal/config,
# everything else is passed through as Options for that channel's
# adapter to decode. No secrets belong in this file: mail auth goes
# through GNOME Online Accounts (goa_identity) or a 0600 password file
# outside the repo (password_env); WhatsApp and Matrix keep their own
# session/device state under $BUNKER_STATE_DIR after "bunker link ...".

# --- bunker app: the TUI in its own window ---
# By default "bunker app" runs the first of ghostty and kitty found on
# PATH. command replaces that whole command line; its last element is
# what the terminal runs, normally the bunker binary.
# [app]
# command = ["wezterm", "start", "--class", "dev.bunker.app", "--", "bunker"]

# --- herdr: bunker as a side panel (deploy/herdr) ---
# notify = true makes "bunker sidebar", when it runs inside herdr, show a
# herdr notification (with its "request" sound) for each new unread
# message, "<sender>: <text>", at most one every 30s (a burst becomes one
# "N mensajes nuevos"). It then replaces the terminal's OSC 777
# notification. Off by default.
# [herdr]
# notify = true

# --- update: new release check ---
# The daemon asks the GitHub API for the latest release two minutes
# after it starts and then once a day (GET
# /repos/reyer3/bunker-go/releases/latest, nothing else is sent), keeps
# the answer in $BUNKER_STATE_DIR/update.json, and reports it through
# "bunker health", the TUI status line and the MCP health tool. A dev
# build never checks. check = false turns it off entirely; "bunker
# update" still works on demand.
# [update]
# check = true

# --- Mail: Gmail (.com), authenticated via GOA/OAuth2 ---
[[account]]
channel = "mail"
name = "example"
imap_host = "imap.gmail.com"
smtp_host = "smtp.gmail.com"
username = "alice@example.com"
auth = "xoauth2"
gmail = true
goa_identity = "alice@example.com"

# --- Mail: .cl Dovecot/Roundcube, password login ---
[[account]]
channel = "mail"
name = "cl"
imap_host = "mail.example.cl"
smtp_host = "mail.example.cl"
username = "alice@example.cl"
auth = "login"
folder_prefix = "INBOX"
folder_sep = "."
# password_env points at a 0600 file holding the password, outside the
# repo (e.g. ~/.config/bunker-go/cl.password). Omit it to rely on GOA
# instead, if the .cl account is also registered there.
password_env = "~/.config/bunker-go/cl.password"
# initial_sync_limit bounds how many of the most recent INBOX messages a
# FRESH (never-synced) store backfills on the first sync; it has no
# effect once a sync cursor already exists. Defaults to 200 when unset;
# must be > 0. Older history beyond this window is still reachable one
# message at a time via `bunker read`/`download` (H1's server fallback)
# or in bulk via `bunker backfill mail cl --since 2026-01-01`.
initial_sync_limit = 200
# index_body_max_kb caps how many KiB of each message's text sync fetches
# and stores, so `bunker list -q` finds mail by its body. The fetch uses
# BODY.PEEK with a byte range: it never marks mail read and never
# downloads a large attachment whole. HTML-only mail stores its rendered
# text. Defaults to 64 when unset; 0 disables it (headers only, and a
# body becomes searchable once the message is read).
index_body_max_kb = 64
# Which folders sync. INBOX (watched live) and Sent are always synced;
# the other folders are polled every couple of minutes. By default that
# is every folder except Trash, Junk/Spam and Drafts (and anything under
# them); on Gmail it is just All Mail, which already holds every label.
# sync_folders replaces that default with an explicit list, and
# exclude_folders leaves folders (with their subfolders) out of either.
# Names resolve like `bunker organize --move`: "Archive", a name under
# folder_prefix such as "Clients.Acme", or the server's full name.
# sync_folders = ["Archive", "Clients.Acme"]
exclude_folders = ["Newsletters"]

# --- WhatsApp: personal account, linked device ---
[[account]]
channel = "whatsapp"
name = "personal"
# db_path defaults to $BUNKER_STATE_DIR/whatsapp-<name>.db; set it only
# to relocate the device store.
# min_send_interval_seconds throttles outgoing messages (default 1s).
# history_messages_per_chat caps how many of the most recent messages a
# history-sync import keeps per unread conversation on link (default 5);
# it never imports a chat's full history.
# max_broadcast_recipients caps a "send"/"reply" fan-out broadcast
# (default 10; see docs/cli.md's Fan-out section). broadcast_pause_min_
# seconds/broadcast_pause_max_seconds bound the randomized pause between
# recipients (default 3/8).
#
# Voice calls (bunker call / calls) are opt-in and experimental: they run
# meowcaller, an unofficial pure-Go implementation of WhatsApp's VoIP
# stack. Audio uses the daemon machine's microphone and speaker through
# two external commands that stream raw s16le mono 16 kHz PCM (stdout for
# capture, stdin for playback); the defaults are PulseAudio's parec/pacat,
# which PipeWire serves too. An empty list disables that direction.
# calls = true
# call_capture_command = ["parec", "--raw", "--format=s16le", "--rate=16000", "--channels=1", "--latency-msec=60"]
# call_playback_command = ["pacat", "--playback", "--raw", "--format=s16le", "--rate=16000", "--channels=1", "--latency-msec=60"]
# With PipeWire's native tools instead (flags vary by version, check
# `pw-cat --help`; the stream must be raw s16le mono 16 kHz on stdout/stdin):
# call_capture_command = ["pw-record", "--rate", "16000", "--channels", "1", "--format", "s16", "-"]
# call_playback_command = ["pw-cat", "--playback", "--rate", "16000", "--channels", "1", "--format", "s16", "-"]
# A command that is not installed makes calls fail up front (and logs a
# warning at startup) instead of ringing silently. Check the setup without
# WhatsApp with `bunker call audio-test`.
# call_capture_gain / call_playback_gain scale your microphone / what you
# hear in software (1 = unchanged, 1.5 = +50%, capped at 8); raise them
# when the call sounds quiet. Too high a gain clips (distorts) the audio.
# call_capture_gain = 1.5
# call_playback_gain = 1.5

# --- Matrix: the company homeserver, E2EE ---
[[account]]
channel = "matrix"
name = "work"
homeserver = "https://matrix.example.org"
# state_dir defaults to $BUNKER_STATE_DIR/matrix/<name>; set it only to
# relocate the session, crypto store and pickle key.
