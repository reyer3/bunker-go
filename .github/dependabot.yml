# Weekly dependency updates. Commit prefixes keep the PRs conventional
# commits for release-please: "build(deps): ..." for Go modules and
# "ci: ..." for workflow actions. Held pins (see the comment block in
# go.mod) are left out of the grouped PR so each gets its own review.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      gomod-minor-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - github.com/emersion/go-imap/v2
          - go.mau.fi/whatsmeow
          - github.com/purpshell/meowcaller
          - maunium.net/go/mautrix
          - github.com/emersion/go-sasl
          - github.com/charmbracelet/x/exp/teatest

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
