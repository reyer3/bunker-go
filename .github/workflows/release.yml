name: release

# Releases are fully automated. Every push to main updates a "release PR"
# (release-please) with the next version, computed from conventional
# commits (feat: -> minor, fix: -> patch while below 1.0), and its
# CHANGELOG. Merging that PR tags the release; the tag push then runs
# goreleaser, which attaches the linux amd64/arm64 binaries.
#
# release-please runs with RELEASE_PLEASE_TOKEN (a fine-grained token with
# contents and pull-requests write on this repo), not the default
# GITHUB_TOKEN: GitHub never triggers workflows for a PR or tag created by
# GITHUB_TOKEN, so the release PR would get no CI (and main requires it),
# and its tag would never reach the goreleaser job below. A tag pushed by
# hand releases the same way.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags goolm -race ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
