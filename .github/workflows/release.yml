name: release

# Releases are fully automated. Every push to main updates a "release PR"
# (release-please) with the next version, computed from conventional
# commits (feat: -> minor, fix: -> patch while below 1.0), and its
# CHANGELOG. Merging that PR tags the release and publishes it; goreleaser
# then attaches the linux amd64/arm64 binaries.
#
# goreleaser runs in this same workflow on purpose: a tag pushed with the
# default GITHUB_TOKEN never triggers another workflow. A tag pushed by
# hand still releases through the tags trigger.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    needs: release-please
    if: >-
      !cancelled() && (
        needs.release-please.outputs.release_created == 'true' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags goolm -race ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
