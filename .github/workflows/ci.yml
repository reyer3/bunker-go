name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet -tags goolm ./...
      - run: go test -tags goolm -race ./...
      # R5: internal/channel/mail's IDLE/reconcile tests raced on shared
      # background goroutines (imapclient's unsolicited-data handlers);
      # rerunning the package 3x under -race catches a regression a
      # single pass could miss without depending on one flaky run.
      - run: go test -tags goolm -race -count=3 ./internal/channel/mail/...
      - run: CGO_ENABLED=0 go build -tags goolm ./...
      # R5: govulncheck/staticcheck run last so a real test/build failure
      # is never hidden behind them. R6 fixed the pre-existing staticcheck
      # findings this step used to report; both are expected to stay green.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest -tags goolm ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest -tags goolm ./...

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install github.com/betterleaks/betterleaks@latest
      - run: betterleaks git --redact .
